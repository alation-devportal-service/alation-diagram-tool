<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alation Diagram Generator</title>
    <style>
        /* Base UI Styling */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; background: #f9f9f9; }
        .container { display: flex; gap: 20px; }
        .panel { flex: 1; background: white; padding: 20px; border-radius: 8px; border: 1px solid #e0e0e0; }
        
        /* Input Area */
        textarea { width: 100%; height: 300px; font-family: monospace; padding: 10px; box-sizing: border-box; resize: vertical; border: 1px solid #ccc; }
        
        /* Controls */
        .controls { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        select, button { padding: 8px 12px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; }
        
        /* Branded Button using Alation Red */
        button.primary { background: #BD0909; color: white; border: none; cursor: pointer; font-weight: bold; }
        button.primary:hover { background: #8a0707; }
        
        /* Output Preview Area */
        /* Left-aligned per the style guide, max-width 672px for visual reference */
        #output-wrapper { margin-top: 20px; border: 1px dashed #ccc; padding: 20px; min-height: 300px; background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAMUlEQVQ4T2NkYGAQYcAP3uCTZhw1gGGYhAGBZIA/O1gwxv///z+AwwgWjEGAcTIahwEAC60KBT72Z3kAAAAASUVORK5CYII='); }
        #output { display: flex; justify-content: flex-start; max-width: 672px; } 
        pre { font-family: monospace; white-space: pre-wrap; margin: 0; }
        .note { font-size: 12px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>🎨 Alation Diagram Generator</h1>
    <p>Generate transparent, left-aligned, brand-compliant SVGs for your documentation.</p>

    <div class="container">
        <div class="panel">
            <h3>1. Input Mermaid Code</h3>
            <textarea id="mermaidInput">graph TD
  A[Start] --> B{Decision}
  B -->|Yes| C[Process]
  B -->|No| D[End]</textarea>
            
            <div class="controls">
                <select id="formatSelect">
                    <option value="svg">SVG Image</option>
                    <option value="ascii">ASCII Text</option>
                </select>
                <select id="themeSelect">
                    <option value="alation">Alation Standard (Red)</option>
                    <option value="github-light">GitHub Light</option>
                    <option value="nord">Nord</option>
                </select>
                <button class="primary" id="generateBtn">Generate Diagram</button>
                <button id="downloadBtn" style="display:none;">Download File</button>
            </div>
            <p class="note">Note: Output is constrained to 672px width to preview page loading optimization rules.</p>
        </div>

        <div class="panel">
            <h3>2. Output</h3>
            <div id="output-wrapper">
                <div id="output"><span style="color: #888; background: white; padding: 5px;">Preview will appear here...</span></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { renderMermaidSVG, renderMermaidASCII, THEMES } from 'https://esm.sh/beautiful-mermaid@latest';

        // Define the Custom Alation Theme based on the PDF Style Guide
        const alationTheme = {
            bg: '#ffffff',       // Base background (will be made transparent)
            fg: '#333333',       // Dark grey for standard node text
            accent: '#BD0909',   // Alation Dark Red for arrows and highlights
            border: '#888888'    // Subtle grey borders to avoid harsh black lines
        };

        let currentResult = '';
        let currentFormat = '';

        document.getElementById('generateBtn').addEventListener('click', () => {
            const code = document.getElementById('mermaidInput').value;
            const format = document.getElementById('formatSelect').value;
            const themeName = document.getElementById('themeSelect').value;
            const outputDiv = document.getElementById('output');

            outputDiv.innerHTML = '<span style="color: #888; background: white; padding: 5px;">Generating...</span>';

            try {
                if (format === 'svg') {
                    // Load chosen theme or fallback to Alation custom theme
                    let activeTheme = themeName === 'alation' ? alationTheme : (THEMES[themeName] || THEMES['github-light']);
                    
                    // Force transparent background per style guide
                    const renderOptions = {
                        ...activeTheme,
                        transparent: true 
                    };

                    const svg = renderMermaidSVG(code, renderOptions);
                    
                    currentResult = svg;
                    currentFormat = 'svg';
                    outputDiv.innerHTML = svg; 
                } else {
                    const ascii = renderMermaidASCII(code, { useAscii: true });
                    currentResult = ascii;
                    currentFormat = 'ascii';
                    outputDiv.innerHTML = `<pre>${ascii.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre>`;
                }
                
                document.getElementById('downloadBtn').style.display = 'inline-block';
            } catch (error) {
                console.error(error);
                outputDiv.innerHTML = `<span style="color:#BD0909; background: white; padding: 5px;"><b>Error parsing diagram:</b><br>${error.message}</span>`;
                document.getElementById('downloadBtn').style.display = 'none';
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!currentResult) return;
            const blob = new Blob([currentResult], { type: currentFormat === 'svg' ? 'image/svg+xml' : 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentFormat === 'svg' ? 'alation-diagram.svg' : 'alation-diagram.txt';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
